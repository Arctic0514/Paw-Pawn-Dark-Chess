  // =========================================================================
  // 6. 遊戲主迴圈與動畫更新
  // =========================================================================
  let lastTime = performance.now();

  function update(dt) {
    state.animClock += dt;

    if (state.screenShake > 0) {
      state.screenShake = Math.max(0, state.screenShake - dt * 35);
    }

    // 處理「開局猜拳 (RPS)」動畫計時與狀態轉換
    if (state.screen === 'RPS') {
      if (state.rps.phase === 'ANIM') {
        state.rps.timer -= dt;
        if (state.rps.timer <= 0) {
          state.rps.phase = 'RESULT';
          state.rps.timer = state.rps.result === 'DRAW' ? 1.15 : 1.35;
          sfx.playRpsResult(state.rps.result);
          if (state.rps.result === 'WIN') {
            spawnParticles(150, 430, '#ffe066', 26, 6);
          } else if (state.rps.result === 'LOSE') {
            spawnParticles(LOGICAL_W - 150, 430, '#80caff', 26, 6);
          }
        }
      } else if (state.rps.phase === 'RESULT') {
        state.rps.timer -= dt;
        if (state.rps.timer <= 0) {
          if (state.rps.result === 'DRAW') {
            // 平手自動進入下一輪重猜
            state.rps.phase = 'CHOOSE';
            state.rps.playerChoice = null;
            state.rps.aiChoice = null;
            state.rps.result = null;
            state.rps.round++;
          } else {
            // 分出勝負，正式進入暗棋棋盤！
            enterBoardAfterRps();
          }
        }
      }
    }

    if (state.flipAnim) {
      state.flipAnim.progress += dt / state.flipAnim.duration;
      if (state.flipAnim.progress >= 1) {
        const { r, c } = state.flipAnim;
        state.flipAnim = null;
        finalizeFlip(r, c);
      }
    }

    if (state.moveAnim) {
      state.moveAnim.progress += dt / state.moveAnim.duration;
      if (state.moveAnim.progress >= 1) {
        const { move, piece } = state.moveAnim;
        state.moveAnim = null;
        finalizeMove(move, piece, null);
      }
    }

    if (state.battleAnim) {
      const b = state.battleAnim;
      b.progress += dt / b.duration;

      if (b.progress >= 0.44 && !b.hitTriggered) {
        b.hitTriggered = true;
        state.screenShake = (b.deathStyle === 'SCREEN_FLY' || b.deathStyle === 'FLATTEN') ? 18 : 13;
        const hitX = 392, hitY = 472;

        if (b.deathStyle === 'ASH') {
          spawnParticles(hitX, hitY, '#ff6b1a', 34, 7.5);
          spawnAshParticles(hitX, hitY, 85);
        } else if (b.deathStyle === 'SCREEN_FLY') {
          spawnParticles(hitX, hitY, '#ffbe3b', 36, 8.5);
          spawnParticles(hitX, hitY, '#ff4d36', 24, 7.0);
        } else if (b.deathStyle === 'ROYAL_BLAST') {
          spawnParticles(hitX, hitY, '#ffd43b', 45, 8.0);
          spawnParticles(hitX, hitY, '#fff9c4', 28, 5.5);
        } else if (b.deathStyle === 'SLASH_SPLIT') {
          spawnParticles(hitX, hitY, '#e0f2fe', 34, 8.0);
          spawnParticles(hitX, hitY, '#ffd43b', 20, 5.5);
        } else if (b.deathStyle === 'FLATTEN') {
          spawnParticles(hitX, hitY + 25, '#c99352', 36, 7.5);
          spawnParticles(hitX, hitY + 25, '#5c3a21', 24, 6.0);
        } else if (b.deathStyle === 'SKY_LAUNCH') {
          spawnParticles(hitX, hitY, '#ffe066', 32, 7.5);
        } else {
          const color = b.attacker.side === SIDE_RED ? '#ff6b35' : '#4cc9f0';
          spawnParticles(hitX, hitY, color, 32, 7.5);
        }
      }

      if (b.progress >= 0.44 && b.deathStyle === 'SCREEN_FLY') {
        const flyP = (b.progress - 0.44) / 0.56;
        b.defScale = 2.35 + Math.pow(flyP, 1.4) * 5.8;
        b.defFlyX = 392 - flyP * 110;
        b.defFlyY = 472 + flyP * 160;
        b.defRot += 0.22;
      }

      if (b.progress >= 1) {
        const { move, attacker, defender } = b;
        state.battleAnim = null;
        finalizeMove(move, attacker, defender);
      }
    }

    if (state.aiThinking && !state.flipAnim && !state.moveAnim && !state.battleAnim && state.screen === 'PLAYING') {
      state.aiTimer -= dt;
      if (state.aiTimer <= 0) {
        state.aiThinking = false;
        const aiAct = getBestAIDarkAction(state.board, state.aiSide, state.difficulty);
        if (aiAct) {
          if (aiAct.type === 'FLIP') {
            executeFlip(aiAct.r, aiAct.c);
          } else {
            executeMove(aiAct);
          }
        }
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= p.decay;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    for (let i = state.ashParticles.length - 1; i >= 0; i--) {
      const ap = state.ashParticles[i];
      ap.wobble += 0.14;
      ap.x += ap.vx + Math.sin(ap.wobble) * 0.85;
      ap.y += ap.vy;
      ap.life -= ap.decay;
      if (ap.life <= 0) state.ashParticles.splice(i, 1);
    }

    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const ft = state.floatingTexts[i];
      ft.y += ft.vy;
      ft.life -= ft.decay;
      if (ft.life <= 0) state.floatingTexts.splice(i, 1);
    }
  }

  function render() {
    state.uiButtons = [];
    ctx.save();
    ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);

    ctx.fillStyle = '#ebd9c5';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    if (state.screenShake > 0) {
      const sx = (Math.random() - 0.5) * state.screenShake;
      const sy = (Math.random() - 0.5) * state.screenShake;
      ctx.translate(sx, sy);
    }

    if (state.screen === 'MENU') {
      renderMenu();
    } else if (state.screen === 'HELP') {
      renderHelp();
    } else if (state.screen === 'RPS') {
      renderRpsScreen();
    } else if (state.screen === 'PLAYING' || state.screen === 'GAMEOVER') {
      renderPlaying();
      if (state.screen === 'GAMEOVER') {
        renderGameOverOverlay();
      }
    }

    for (const ap of state.ashParticles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ap.life);
      ctx.fillStyle = `rgb(${ap.shade}, ${ap.shade}, ${ap.shade})`;
      ctx.beginPath();
      ctx.ellipse(ap.x, ap.y, ap.size, ap.size * 0.6, ap.wobble, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const ft of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.font = `bold ${ft.size}px "PingFang TC", "Microsoft JhengHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#1a0a04';
      ctx.lineWidth = 4;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // =========================================================================
  // 7. Pointer 觸控與滑鼠點擊事件處理 (支援猜拳、翻開暗棋、選取、飛炮跳吃與取消選取)
  // =========================================================================
  function getLogicalPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = LOGICAL_W / rect.width;
    const scaleY = LOGICAL_H / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.unlock();
    const pt = getLogicalPoint(e);

    // 1. 優先檢查 UI 按鈕點擊
    for (let i = state.uiButtons.length - 1; i >= 0; i--) {
      const btn = state.uiButtons[i];
      if (pt.x >= btn.x && pt.x <= btn.x + btn.w && pt.y >= btn.y && pt.y <= btn.y + btn.h) {
        if (btn.label.includes('音效') || btn.action === 'MUTE') {
          sfx.toggleMute();
          if (!sfx.muted) sfx.playSelect();
          return;
        }
        if (btn.action === 'DESELECT') {
          state.selected = null;
          state.legalMoves = [];
          sfx.playCancel();
          return;
        }
        // 開局猜拳按鈕
        if (btn.action === 'RPS_SCISSORS') {
          startRpsShowdown('SCISSORS');
          return;
        }
        if (btn.action === 'RPS_ROCK') {
          startRpsShowdown('ROCK');
          return;
        }
        if (btn.action === 'RPS_PAPER') {
          startRpsShowdown('PAPER');
          return;
        }

        sfx.playSelect();
        if (btn.action === 'START_NORMAL') resetGame('AI', 'normal');
        else if (btn.action === 'START_HARD') resetGame('AI', 'hard');
        else if (btn.action === 'START_PVP') resetGame('PVP', 'normal');
        else if (btn.action === 'HELP') state.screen = 'HELP';
        else if (btn.action === 'MENU') state.screen = 'MENU';
        else if (btn.action === 'RESTART') resetGame(state.mode, state.difficulty);
        else if (btn.action === 'UNDO') handleUndo();
        return;
      }
    }

    // 2. 暗棋棋盤對弈操作
    if (state.screen !== 'PLAYING') return;
    if (state.flipAnim || state.moveAnim || state.battleAnim || state.aiThinking) return;
    if (state.mode === 'AI' && !state.playerSide && state.firstMover === 'OPPONENT') return;
    if (state.mode === 'AI' && state.playerSide && state.turn !== state.playerSide) return;

    const cell = pixelToGrid(pt.x, pt.y);

    if (!cell) {
      if (state.selected) {
        state.selected = null;
        state.legalMoves = [];
        sfx.playCancel();
      }
      return;
    }

    const clickedPiece = state.board[cell.r][cell.c];

    if (state.selected) {
      if (state.selected.r === cell.r && state.selected.c === cell.c) {
        state.selected = null;
        state.legalMoves = [];
        sfx.playCancel();
        return;
      }

      const chosenMove = state.legalMoves.find(m => m.tr === cell.r && m.tc === cell.c);
      if (chosenMove) {
        executeMove(chosenMove);
        return;
      }

      if (clickedPiece && clickedPiece.revealed && clickedPiece.side === state.turn) {
        state.selected = { r: cell.r, c: cell.c };
        state.legalMoves = getLegalMovesForPiece(state.board, cell.r, cell.c);
        sfx.playSelect();
        return;
      }

      if (clickedPiece && !clickedPiece.revealed) {
        state.selected = null;
        state.legalMoves = [];
        sfx.playCancel();
        const pos = gridToPixel(cell.r, cell.c);
        spawnFloatingText(pos.x, pos.y - 22, '已取消選取，再點一次即可翻開暗棋', '#ffe066', 16);
        return;
      }

      if (clickedPiece && clickedPiece.revealed && clickedPiece.side !== state.turn) {
        sfx.playInvalid();
        const reason = getCannotCaptureReason(state.board, state.selected.r, state.selected.c, cell.r, cell.c);
        const pos = gridToPixel(cell.r, cell.c);
        spawnFloatingText(LOGICAL_W / 2, pos.y - 24, reason, '#ff6b6b', 17);
        return;
      }

      state.selected = null;
      state.legalMoves = [];
      sfx.playCancel();
      return;
    }

    if (!clickedPiece) return;

    if (!clickedPiece.revealed) {
      executeFlip(cell.r, cell.c);
      return;
    }

    if (clickedPiece.side === state.turn) {
      state.selected = { r: cell.r, c: cell.c };
      state.legalMoves = getLegalMovesForPiece(state.board, cell.r, cell.c);
      sfx.playSelect();
    } else {
      sfx.playCancel();
      const pos = gridToPixel(cell.r, cell.c);
      const enemyArmy = clickedPiece.side === SIDE_RED ? '紅方' : '黑方';
      spawnFloatingText(pos.x, pos.y - 24, `這是對手（${enemyArmy}）的棋子`, '#ff8b66', 16);
    }
  });
})();
</script>
