<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>楚漢演武 · 3D貓咪暗棋</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ebd9c5;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      touch-action: none;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #f5e8d8 0%, #e2ccb5 100%);
    }
    canvas {
      display: block;
      touch-action: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
  </div>

<script>
(() => {
  'use strict';

  // 安全防護：確保 Canvas arc 與 ellipse 半徑永遠 >= 0.1，避免任何瀏覽器拋出 IndexSizeError
  if (typeof CanvasRenderingContext2D !== 'undefined') {
    const origArc = CanvasRenderingContext2D.prototype.arc;
    CanvasRenderingContext2D.prototype.arc = function(x, y, r, sAngle, eAngle, counterclockwise) {
      return origArc.call(this, x, y, Math.max(0.1, r || 0.1), sAngle, eAngle, counterclockwise);
    };
    if (CanvasRenderingContext2D.prototype.ellipse) {
      const origEllipse = CanvasRenderingContext2D.prototype.ellipse;
      CanvasRenderingContext2D.prototype.ellipse = function(x, y, rx, ry, rot, sAngle, eAngle, ccw) {
        return origEllipse.call(this, x, y, Math.max(0.1, rx || 0.1), Math.max(0.1, ry || 0.1), rot, sAngle, eAngle, ccw);
      };
    }
  }

  // =========================================================================
  // 1. Web Audio 寫實貓咪與軍武音效合成引擎 (無外部檔案、支援靜音與點擊解鎖)
  // =========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.unlocked = false;
    }

    unlock() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      this.unlocked = true;
    }

    toggleMute() {
      this.muted = !this.muted;
      return this.muted;
    }

    playTone(freq, type, duration, vol = 0.2, slideFreq = null, delay = 0) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideFreq), now + duration);
      }
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    playNoise(duration, vol = 0.25, filterFreq = 1000, delay = 0) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime + delay;
      const bufferSize = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + duration);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
      noise.stop(now + duration + 0.02);
    }

    playMeow(pitch = 620, delay = 0) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(pitch * 0.85, now);
      osc.frequency.linearRampToValueAtTime(pitch * 1.25, now + 0.07);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.72, now + 0.22);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    playSelect() {
      this.playMeow(660, 0);
    }

    playCancel() {
      this.playTone(420, 'triangle', 0.1, 0.14, 290);
    }

    playInvalid() {
      this.playTone(190, 'sawtooth', 0.15, 0.18, 130);
    }

    playRpsSwing() {
      // 猜拳搖擺節奏音效 (剪刀、石頭、布！)
      this.playTone(330, 'triangle', 0.1, 0.22, 440, 0.0);
      this.playTone(330, 'triangle', 0.1, 0.22, 440, 0.22);
      this.playTone(490, 'triangle', 0.14, 0.28, 660, 0.44);
    }

    playRpsResult(result) {
      if (result === 'WIN') {
        this.playTone(523.25, 'triangle', 0.15, 0.26, 659.25, 0);
        this.playTone(783.99, 'triangle', 0.25, 0.28, 1046.5, 0.12);
        this.playMeow(760, 0.15);
      } else if (result === 'LOSE') {
        this.playTone(392, 'sawtooth', 0.18, 0.18, 330, 0);
        this.playTone(293.66, 'sawtooth', 0.25, 0.18, 220, 0.15);
      } else {
        // 平手音效
        this.playTone(440, 'sine', 0.12, 0.22, 440, 0);
        this.playTone(440, 'sine', 0.15, 0.22, 490, 0.14);
      }
    }

    playFlip() {
      this.playTone(320, 'sine', 0.08, 0.28, 720);
      this.playNoise(0.05, 0.18, 1600);
      this.playMeow(700, 0.05);
    }

    playMove() {
      this.playTone(210, 'sine', 0.09, 0.34, 70);
      this.playNoise(0.05, 0.16, 950);
    }

    playBattle(pieceType) {
      this.playMeow(740, 0);
      switch (pieceType) {
        case 'C':
          this.playNoise(0.15, 0.16, 3200, 0.05);
          this.playNoise(0.55, 0.45, 620, 0.22);
          this.playTone(135, 'sawtooth', 0.45, 0.38, 30, 0.22);
          this.playNoise(0.45, 0.18, 1800, 0.55);
          break;
        case 'R':
          this.playTone(120, 'sawtooth', 0.25, 0.28, 220, 0.02);
          this.playNoise(0.35, 0.38, 1300, 0.22);
          this.playTone(280, 'triangle', 0.38, 0.32, 920, 0.25);
          break;
        case 'H':
          this.playTone(540, 'sawtooth', 0.18, 0.22, 340, 0.04);
          this.playNoise(0.28, 0.32, 1600, 0.22);
          this.playTone(180, 'sine', 0.3, 0.36, 48, 0.22);
          break;
        case 'E':
          this.playTone(160, 'sawtooth', 0.25, 0.24, 95, 0.04);
          this.playTone(90, 'sine', 0.5, 0.48, 26, 0.2);
          this.playNoise(0.38, 0.35, 480, 0.2);
          break;
        case 'A':
          this.playTone(1050, 'sawtooth', 0.12, 0.22, 1550, 0.08);
          this.playTone(1320, 'triangle', 0.18, 0.24, 580, 0.18);
          this.playNoise(0.2, 0.24, 3000, 0.2);
          break;
        case 'K':
          this.playTone(210, 'sawtooth', 0.4, 0.35, 75, 0.06);
          this.playTone(420, 'square', 0.32, 0.24, 95, 0.12);
          this.playNoise(0.35, 0.3, 1100, 0.2);
          break;
        default:
          this.playTone(390, 'square', 0.12, 0.22, 780, 0.06);
          this.playNoise(0.22, 0.28, 2100, 0.16);
          break;
      }
    }

    playWin() {
      const melody = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
      const times = [0, 0.12, 0.24, 0.38, 0.55, 0.70];
      melody.forEach((f, i) => {
        this.playTone(f, 'triangle', 0.28, 0.26, null, times[i]);
      });
      this.playMeow(780, 0.75);
    }

    playLose() {
      const melody = [440, 392, 349.23, 293.66, 220];
      melody.forEach((f, i) => {
        this.playTone(f, 'sawtooth', 0.28, 0.18, f * 0.92, i * 0.16);
      });
    }
  }

  const sfx = new SoundEngine();

  // =========================================================================
  // 2. 台灣暗棋（半盤 4x8）核心規則與 3D 貓咪武將設定
  // =========================================================================
  const SIDE_RED = 'R';   // 漢 (赤虎橘貓軍團)
  const SIDE_BLACK = 'B'; // 楚 (玄豹黑貓軍團)

  const ROWS = 8;
  const COLS = 4;

  const PIECE_LABELS = {
    R: { K: '帥', A: '仕', E: '相', R: '俥', H: '傌', C: '炮', P: '兵' },
    B: { K: '將', A: '士', E: '象', R: '車', H: '馬', C: '包', P: '卒' }
  };

  const PIECE_TITLES = {
    K: 'Lv.7 金冠大元帥',
    A: 'Lv.6 雙刀護衛貓',
    E: 'Lv.5 重裝戰象貓',
    R: 'Lv.4 裝甲戰車貓',
    H: 'Lv.3 重甲騎兵貓',
    C: 'Lv.2 飛炮火砲貓',
    P: 'Lv.1 弒帥先鋒貓'
  };

  const DARK_RANKS = {
    K: 7,
    A: 6,
    E: 5,
    R: 4,
    H: 3,
    C: 2,
    P: 1
  };

  const PIECE_VALUES = {
    K: 950, A: 520, E: 360, R: 240, H: 150, C: 380, P: 180
  };

  const BATTLE_MOVES = {
    K: ['皇極虎嘯震天波！', '霸王金印鎮四方！'],
    A: ['寒光雙刃十字斬！', '御前護衛旋風擊！'],
    E: ['巨象長鼻狂嵐水柱！', '萬鈞巨石泰山壓扁！'],
    H: ['幻影鐵騎後空翻踢！', '天馬流星升龍連踏！'],
    R: ['裝甲戰車全速撞飛！', '重型履帶狂飆突擊！'],
    C: ['隔山飛炮烈焰轟炸！', '高爆砲彈焦黑化灰！'],
    P: ['小兵立大功穿雲刺！', '先鋒突擊破陣斬！']
  };

  const RPS_INFO = {
    SCISSORS: { icon: '✌️', name: '剪刀' },
    ROCK:     { icon: '✊', name: '石頭' },
    PAPER:    { icon: '🖐️', name: '布' }
  };

  function createInitialDarkBoard() {
    const counts = [
      { type: 'K', count: 1 },
      { type: 'A', count: 2 },
      { type: 'E', count: 2 },
      { type: 'R', count: 2 },
      { type: 'H', count: 2 },
      { type: 'C', count: 2 },
      { type: 'P', count: 5 }
    ];
    const pool = [];
    for (const side of [SIDE_RED, SIDE_BLACK]) {
      for (const item of counts) {
        for (let i = 0; i < item.count; i++) {
          pool.push({ side, type: item.type, revealed: false });
        }
      }
    }
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i];
      pool[i] = pool[j];
      pool[j] = tmp;
    }

    const b = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    let idx = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        b[r][c] = pool[idx++];
      }
    }
    return b;
  }

  function cloneBoard(board) {
    return board.map(row => row.map(cell => (cell ? { ...cell } : null)));
  }

  function inBounds(r, c) {
    return r >= 0 && r < ROWS && c >= 0 && c < COLS;
  }

  function canRegularCapture(attackerType, defenderType) {
    if (attackerType === 'C') return false;
    if (attackerType === 'K' && defenderType === 'P') return false;
    if (attackerType === 'P' && defenderType === 'K') return true;
    return DARK_RANKS[attackerType] >= DARK_RANKS[defenderType];
  }

  function getLegalMovesForPiece(board, r, c) {
    const p = board[r][c];
    if (!p || !p.revealed) return [];
    const moves = [];
    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (!inBounds(nr, nc)) continue;
      const target = board[nr][nc];
      if (!target) {
        moves.push({ type: 'MOVE', fr: r, fc: c, tr: nr, tc: nc });
      } else if (target.revealed && target.side !== p.side) {
        if (canRegularCapture(p.type, target.type)) {
          moves.push({ type: 'CAPTURE', fr: r, fc: c, tr: nr, tc: nc });
        }
      }
    }

    if (p.type === 'C') {
      for (const [dr, dc] of dirs) {
        let nr = r + dr, nc = c + dc;
        let screenCount = 0;
        while (inBounds(nr, nc)) {
          const cell = board[nr][nc];
          if (cell) {
            if (screenCount === 0) {
              screenCount = 1;
            } else {
              if (cell.revealed && cell.side !== p.side) {
                moves.push({ type: 'CAPTURE', fr: r, fc: c, tr: nr, tc: nc });
              }
              break;
            }
          }
          nr += dr;
          nc += dc;
        }
      }
    }

    return moves;
  }

  function getAllLegalActions(board, side) {
    const actions = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = board[r][c];
        if (!p) continue;
        if (!p.revealed) {
          actions.push({ type: 'FLIP', r, c });
        } else if (p.side === side) {
          const pm = getLegalMovesForPiece(board, r, c);
          for (const m of pm) actions.push(m);
        }
      }
    }
    return actions;
  }

  function countRemainingPieces(board, side) {
    let count = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = board[r][c];
        if (p && p.side === side) count++;
      }
    }
    return count;
  }

  function isSquareThreatened(board, r, c, mySide, myType) {
    const enemySide = mySide === SIDE_RED ? SIDE_BLACK : SIDE_RED;
    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];

    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (!inBounds(nr, nc)) continue;
      const ep = board[nr][nc];
      if (ep && ep.revealed && ep.side === enemySide) {
        if (canRegularCapture(ep.type, myType)) return true;
      }
    }

    for (const [dr, dc] of dirs) {
      let nr = r + dr, nc = c + dc;
      let screenCount = 0;
      while (inBounds(nr, nc)) {
        const cell = board[nr][nc];
        if (cell) {
          if (screenCount === 0) {
            screenCount = 1;
          } else {
            if (cell.revealed && cell.side === enemySide && cell.type === 'C') {
              return true;
            }
            break;
          }
        }
        nr += dr;
        nc += dc;
      }
    }
    return false;
  }

  function getCannotCaptureReason(board, fr, fc, tr, tc) {
    const atk = board[fr][fc];
    const def = board[tr][tc];
    if (!atk || !def || !def.revealed) return '請先翻開暗棋！';

    const dr = Math.abs(fr - tr);
    const dc = Math.abs(fc - tc);
    const isAdjacent = (dr + dc === 1);

    if (atk.type === 'C') {
      if (isAdjacent) {
        return '⚠️ 炮/包不能直接吃相鄰棋子，需隔一子跳吃！';
      }
      return '⚠️ 炮/包必須在同一直線且中間剛好隔一顆棋子才能跳吃！';
    }

    if (!isAdjacent) {
      return '⚠️ 除炮/包以外，每次只能走一步或吃相鄰一格的敵棋！';
    }

    if (atk.type === 'K' && def.type === 'P') {
      return `⚠️ 暗棋規則：【${PIECE_LABELS[atk.side].K}】不能吃【${PIECE_LABELS[def.side].P}】！`;
    }

    return `⚠️ 階級不足：【${PIECE_LABELS[atk.side][atk.type]}】無法吃更高階的【${PIECE_LABELS[def.side][def.type]}】！`;
  }

  // =========================================================================
  // 3. 智慧暗棋 AI 決策系統 (支援翻棋評估、飛炮獵殺、逃生與追擊)
  // =========================================================================
  function getBestAIDarkAction(board, aiSide, difficulty) {
    if (!aiSide) {
      // 當電腦猜拳獲勝先手開局時，隨機翻開一顆暗棋決定花色
      const flips = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] && !board[r][c].revealed) {
            flips.push({ type: 'FLIP', r, c });
          }
        }
      }
      return flips[Math.floor(Math.random() * flips.length)] || null;
    }

    const actions = getAllLegalActions(board, aiSide);
    if (actions.length === 0) return null;

    let bestScore = -Infinity;
    let bestActions = [];

    for (const act of actions) {
      let score = 0;

      if (act.type === 'CAPTURE') {
        const atk = board[act.fr][act.fc];
        const def = board[act.tr][act.tc];
        const targetVal = PIECE_VALUES[def.type] || 150;
        const myVal = PIECE_VALUES[atk.type] || 150;

        score += 320 + targetVal * 1.35;
        if (atk.type === 'P' && def.type === 'K') score += 600;

        const tempBoard = cloneBoard(board);
        tempBoard[act.tr][act.tc] = tempBoard[act.fr][act.fc];
        tempBoard[act.fr][act.fc] = null;

        if (difficulty === 'hard' && isSquareThreatened(tempBoard, act.tr, act.tc, aiSide, atk.type)) {
          score -= myVal * 0.95;
        }

      } else if (act.type === 'MOVE') {
        const atk = board[act.fr][act.fc];
        const myVal = PIECE_VALUES[atk.type] || 150;
        const currentlyInDanger = isSquareThreatened(board, act.fr, act.fc, aiSide, atk.type);

        const tempBoard = cloneBoard(board);
        tempBoard[act.tr][act.tc] = tempBoard[act.fr][act.fc];
        tempBoard[act.fr][act.fc] = null;
        const nextInDanger = isSquareThreatened(tempBoard, act.tr, act.tc, aiSide, atk.type);

        if (currentlyInDanger && !nextInDanger) {
          score += 240 + myVal * 0.9;
        } else if (!currentlyInDanger && nextInDanger) {
          score -= 280 + myVal;
        } else {
          score += 18;
          if (difficulty === 'hard' && atk.type !== 'C') {
            for (let r = 0; r < ROWS; r++) {
              for (let c = 0; c < COLS; c++) {
                const ep = board[r][c];
                if (ep && ep.revealed && ep.side !== aiSide && canRegularCapture(atk.type, ep.type)) {
                  const oldDist = Math.abs(act.fr - r) + Math.abs(act.fc - c);
                  const newDist = Math.abs(act.tr - r) + Math.abs(act.tc - c);
                  if (newDist < oldDist) score += 45 + (PIECE_VALUES[ep.type] || 100) * 0.08;
                }
              }
            }
          }
        }

      } else if (act.type === 'FLIP') {
        score += 95;
        if (difficulty === 'hard') {
          const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
          for (const [dr, dc] of dirs) {
            const nr = act.r + dr, nc = act.c + dc;
            if (!inBounds(nr, nc)) continue;
            const neighbor = board[nr][nc];
            if (neighbor && neighbor.revealed) {
              if (neighbor.side !== aiSide && DARK_RANKS[neighbor.type] >= 4) {
                score -= 35;
              } else if (neighbor.side === aiSide && DARK_RANKS[neighbor.type] >= 5) {
                score += 22;
              }
            }
          }
        }
      }

      score += (Math.random() - 0.5) * (difficulty === 'hard' ? 18 : 65);

      if (score > bestScore) {
        bestScore = score;
        bestActions = [act];
      } else if (Math.abs(score - bestScore) < 5) {
        bestActions.push(act);
      }
    }

    return bestActions[Math.floor(Math.random() * bestActions.length)];
  }

  // =========================================================================
  // 4. 遊戲狀態與 4x8 半盤自適應排版
  // =========================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const LOGICAL_W = 540;
  const LOGICAL_H = 960;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const targetRatio = LOGICAL_W / LOGICAL_H;
    const winRatio = winW / winH;

    let displayW, displayH;
    if (winRatio < targetRatio) {
      displayW = winW;
      displayH = winW / targetRatio;
    } else {
      displayH = winH;
      displayW = winH * targetRatio;
    }

    canvas.style.width = `${Math.floor(displayW)}px`;
    canvas.style.height = `${Math.floor(displayH)}px`;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const BOARD_LEFT = 54;
  const BOARD_TOP = 186;
  const CELL_W = 108;
  const CELL_H = 66;
  const BOARD_W = CELL_W * COLS; // 432
  const BOARD_H = CELL_H * ROWS; // 528

  function gridToPixel(r, c) {
    return {
      x: BOARD_LEFT + (c + 0.5) * CELL_W,
      y: BOARD_TOP + (r + 0.5) * CELL_H
    };
  }

  function pixelToGrid(x, y) {
    if (x < BOARD_LEFT - 12 || x > BOARD_LEFT + BOARD_W + 12 ||
        y < BOARD_TOP - 12 || y > BOARD_TOP + BOARD_H + 12) {
      return null;
    }
    const c = Math.floor((x - BOARD_LEFT) / CELL_W);
    const r = Math.floor((y - BOARD_TOP) / CELL_H);
    if (inBounds(r, c)) {
      return { r, c };
    }
    return null;
  }

  const state = {
    screen: 'MENU',
    mode: 'AI',
    difficulty: 'normal',
    board: createInitialDarkBoard(),
    turn: SIDE_RED,
    firstMover: 'PLAYER', // 'PLAYER' (1P) 或 'OPPONENT' (AI / 2P)，由開局猜拳決定！
    playerSide: null,     // 第一顆翻開的棋子決定花色陣營
    aiSide: null,
    rps: {
      phase: 'CHOOSE',    // 'CHOOSE' | 'ANIM' | 'RESULT'
      playerChoice: null,
      aiChoice: null,
      result: null,       // 'WIN' | 'LOSE' | 'DRAW'
      timer: 0,
      round: 1
    },
    selected: null,
    legalMoves: [],
    lastMove: null,
    history: [],
    score: 0,
    bestScore: (() => {
      try { return parseInt(localStorage.getItem('chuhan_dark_best_score') || '0', 10) || 0; }
      catch (e) { return 0; }
    })(),
    turnCount: 1,
    capturedByRed: [],
    capturedByBlack: [],
    aiThinking: false,
    aiTimer: 0,
    winner: null,
    winReason: '',
    flipAnim: null,
    moveAnim: null,
    battleAnim: null,
    particles: [],
    ashParticles: [],
    floatingTexts: [],
    screenShake: 0,
    uiButtons: [],
    animClock: 0
  };

  // 重置遊戲並進入「開局猜拳決定先後手」畫面！
  function resetGame(mode = state.mode, difficulty = state.difficulty) {
    state.mode = mode;
    state.difficulty = difficulty;
    state.board = createInitialDarkBoard();
    state.turn = SIDE_RED;
    state.firstMover = 'PLAYER';
    state.playerSide = null;
    state.aiSide = null;
    state.selected = null;
    state.legalMoves = [];
    state.lastMove = null;
    state.history = [];
    state.score = 0;
    state.turnCount = 1;
    state.capturedByRed = [];
    state.capturedByBlack = [];
    state.aiThinking = false;
    state.aiTimer = 0;
    state.winner = null;
    state.winReason = '';
    state.flipAnim = null;
    state.moveAnim = null;
    state.battleAnim = null;
    state.particles = [];
    state.ashParticles = [];
    state.floatingTexts = [];
    state.screenShake = 0;

    // 初始化開局猜拳狀態
    state.rps = {
      phase: 'CHOOSE',
      playerChoice: null,
      aiChoice: null,
      result: null,
      timer: 0,
      round: 1
    };
    state.screen = 'RPS';
  }

  // 玩家在開局猜拳畫面選擇「剪刀 / 石頭 / 布」
  function startRpsShowdown(playerChoice) {
    if (state.rps.phase !== 'CHOOSE') return;
    const keys = ['SCISSORS', 'ROCK', 'PAPER'];
    const aiChoice = keys[Math.floor(Math.random() * keys.length)];

    let result = 'DRAW';
    if (playerChoice !== aiChoice) {
      if (
        (playerChoice === 'ROCK' && aiChoice === 'SCISSORS') ||
        (playerChoice === 'SCISSORS' && aiChoice === 'PAPER') ||
        (playerChoice === 'PAPER' && aiChoice === 'ROCK')
      ) {
        result = 'WIN';
      } else {
        result = 'LOSE';
      }
    }

    state.rps.playerChoice = playerChoice;
    state.rps.aiChoice = aiChoice;
    state.rps.result = result;
    state.rps.phase = 'ANIM';
    state.rps.timer = 0.62;
    sfx.playRpsSwing();
  }

  // 猜拳分出勝負後，正式進入暗棋棋盤！
  function enterBoardAfterRps() {
    const playerWonRps = state.rps.result === 'WIN';
    state.firstMover = playerWonRps ? 'PLAYER' : 'OPPONENT';
    state.screen = 'PLAYING';

    if (playerWonRps) {
      const msg = state.mode === 'PVP' ? '🎉 1P 猜拳獲勝！由 1P 先手翻棋！' : '🎉 猜拳獲勝！由您奪得先手翻棋權！';
      spawnFloatingText(LOGICAL_W / 2, 260, msg, '#ffe066', 22);
    } else {
      if (state.mode === 'AI') {
        spawnFloatingText(LOGICAL_W / 2, 260, '🤖 電腦猜拳獲勝！由電腦先手翻開首棋...', '#80caff', 21);
        state.aiThinking = true;
        state.aiTimer = 0.65;
      } else {
        spawnFloatingText(LOGICAL_W / 2, 260, '🎉 2P 猜拳獲勝！由 2P 先手翻棋！', '#80caff', 22);
      }
    }
  }

  function saveHistorySnapshot() {
    state.history.push({
      board: cloneBoard(state.board),
      turn: state.turn,
      firstMover: state.firstMover,
      playerSide: state.playerSide,
      aiSide: state.aiSide,
      lastMove: state.lastMove ? { ...state.lastMove } : null,
      score: state.score,
      turnCount: state.turnCount,
      capturedByRed: [...state.capturedByRed],
      capturedByBlack: [...state.capturedByBlack]
    });
  }

  function spawnParticles(x, y, color, count = 22, speed = 5) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const spd = speed * (0.4 + Math.random() * 0.9);
      state.particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1.5,
        size: 3 + Math.random() * 5,
        color,
        life: 1.0,
        decay: 0.022 + Math.random() * 0.02
      });
    }
  }

  function spawnAshParticles(x, y, count = 55) {
    for (let i = 0; i < count; i++) {
      state.ashParticles.push({
        x: x + (Math.random() - 0.5) * 34,
        y: y + (Math.random() - 0.5) * 34,
        vx: (Math.random() - 0.35) * 1.6,
        vy: -0.9 - Math.random() * 2.2,
        size: 2 + Math.random() * 3.8,
        shade: Math.floor(25 + Math.random() * 65),
        wobble: Math.random() * Math.PI * 2,
        life: 1.0,
        decay: 0.014 + Math.random() * 0.012
      });
    }
  }

  function spawnFloatingText(x, y, text, color = '#ffd86b', size = 22) {
    state.floatingTexts.push({
      x, y,
      text,
      color,
      size,
      vy: -1.3,
      life: 1.0,
      decay: 0.015
    });
  }

  function executeFlip(r, c) {
    const piece = state.board[r][c];
    if (!piece || piece.revealed) return;

    saveHistorySnapshot();
    state.selected = null;
    state.legalMoves = [];
    sfx.playFlip();

    const pos = gridToPixel(r, c);
    state.flipAnim = {
      r, c,
      x: pos.x,
      y: pos.y,
      piece,
      progress: 0,
      duration: 0.28,
      revealedTriggered: false
    };
  }

  function finalizeFlip(r, c) {
    const piece = state.board[r][c];
    if (!piece) return;
    piece.revealed = true;

    const pos = gridToPixel(r, c);
    const isRed = piece.side === SIDE_RED;
    spawnParticles(pos.x, pos.y, isRed ? '#ff7b54' : '#58b4ff', 16, 3.8);

    // 若是本局第一顆翻開的棋子 -> 依據「猜拳勝方（先手）」決定雙方陣營！
    if (!state.playerSide) {
      if (state.firstMover === 'PLAYER') {
        // 玩家（或 1P）先手翻開：翻出的顏色即為玩家陣營
        state.playerSide = piece.side;
        state.aiSide = piece.side === SIDE_RED ? SIDE_BLACK : SIDE_RED;
        state.turn = piece.side;
        const armyName = isRed ? '赤虎紅貓軍' : '玄豹黑貓軍';
        spawnFloatingText(LOGICAL_W / 2, pos.y - 28, `首翻定陣營：您執【${armyName}】！`, '#ffe066', 22);
      } else {
        // 對手（電腦 AI 或 2P）猜拳獲勝先手翻開：翻出的顏色歸對手，玩家執另一色！
        state.aiSide = piece.side;
        state.playerSide = piece.side === SIDE_RED ? SIDE_BLACK : SIDE_RED;
        state.turn = piece.side;
        const myArmyName = state.playerSide === SIDE_RED ? '赤虎紅貓軍' : '玄豹黑貓軍';
        const oppLabel = state.mode === 'AI' ? '電腦' : '2P';
        const oppArmy = isRed ? '紅貓' : '黑貓';
        spawnFloatingText(LOGICAL_W / 2, pos.y - 28, `${oppLabel}首翻得【${oppArmy}】，您執【${myArmyName}】！`, '#ffe066', 20);
      }
    } else {
      const label = PIECE_LABELS[piece.side][piece.type];
      spawnFloatingText(pos.x, pos.y - 26, `翻開【${label}】`, isRed ? '#ff9e80' : '#90d5ff', 20);
    }

    state.lastMove = { fr: r, fc: c, tr: r, tc: c };
    advanceTurnAfterAction();
  }

  function executeMove(move) {
    const movingPiece = state.board[move.fr][move.fc];
    const targetPiece = state.board[move.tr][move.tc];
    if (!movingPiece) return;

    saveHistorySnapshot();

    const startPos = gridToPixel(move.fr, move.fc);
    const endPos = gridToPixel(move.tr, move.tc);

    state.board[move.fr][move.fc] = null;
    state.selected = null;
    state.legalMoves = [];

    if (targetPiece) {
      state.board[move.tr][move.tc] = null;
      sfx.playBattle(movingPiece.type);
      const moveNames = BATTLE_MOVES[movingPiece.type] || ['霸氣喵擊！'];
      const moveTitle = moveNames[Math.floor(Math.random() * moveNames.length)];

      const styleMap = {
        K: 'ROYAL_BLAST',
        A: 'SLASH_SPLIT',
        E: 'FLATTEN',
        H: 'SKY_LAUNCH',
        R: 'SCREEN_FLY',
        C: 'ASH',
        P: 'SKEWER_FLY'
      };
      const deathStyle = styleMap[movingPiece.type] || 'SKEWER_FLY';

      state.battleAnim = {
        move,
        attacker: { ...movingPiece },
        defender: { ...targetPiece },
        startX: startPos.x,
        startY: startPos.y,
        targetX: endPos.x,
        targetY: endPos.y,
        progress: 0,
        duration: 1.85,
        hitTriggered: false,
        deathStyle,
        title: moveTitle,
        defFlyX: 378,
        defFlyY: 455,
        defScale: 2.35,
        defRot: 0
      };
    } else {
      sfx.playMove();
      state.moveAnim = {
        move,
        piece: { ...movingPiece },
        startX: startPos.x,
        startY: startPos.y,
        targetX: endPos.x,
        targetY: endPos.y,
        progress: 0,
        duration: 0.16
      };
    }
  }

  function finalizeMove(move, movingPiece, capturedPiece) {
    state.board[move.tr][move.tc] = movingPiece;
    state.lastMove = move;

    if (capturedPiece) {
      const pts = Math.round((PIECE_VALUES[capturedPiece.type] || 150) / 5);
      if (movingPiece.side === SIDE_RED) {
        state.capturedByRed.push(capturedPiece);
      } else {
        state.capturedByBlack.push(capturedPiece);
      }

      const isPlayerCapture = (state.mode === 'PVP') || (movingPiece.side === state.playerSide);
      if (isPlayerCapture) {
        state.score += pts;
        if (state.score > state.bestScore) {
          state.bestScore = state.score;
          try { localStorage.setItem('chuhan_dark_best_score', String(state.bestScore)); } catch (e) {}
        }
        const pos = gridToPixel(move.tr, move.tc);
        spawnFloatingText(pos.x, pos.y - 32, `+${pts} 戰功`, '#ffe066', 20);
      }
    }

    advanceTurnAfterAction();
  }

  function advanceTurnAfterAction() {
    state.turn = state.turn === SIDE_RED ? SIDE_BLACK : SIDE_RED;
    if (state.turn === (state.playerSide || SIDE_RED)) {
      state.turnCount++;
    }

    const redRemain = countRemainingPieces(state.board, SIDE_RED);
    const blkRemain = countRemainingPieces(state.board, SIDE_BLACK);
    const nextActions = getAllLegalActions(state.board, state.turn);

    if (redRemain === 0 || blkRemain === 0 || nextActions.length === 0) {
      if (redRemain === 0) {
        state.winner = SIDE_BLACK;
      } else if (blkRemain === 0) {
        state.winner = SIDE_RED;
      } else {
        state.winner = state.turn === SIDE_RED ? SIDE_BLACK : SIDE_RED;
      }

      const isPlayerWin = state.mode === 'PVP'
        ? (state.winner === SIDE_RED)
        : (state.winner === (state.playerSide || SIDE_RED));

      if (isPlayerWin) {
        state.score += 500;
        if (state.score > state.bestScore) {
          state.bestScore = state.score;
          try { localStorage.setItem('chuhan_dark_best_score', String(state.bestScore)); } catch (e) {}
        }
        state.winReason = (redRemain === 0 || blkRemain === 0)
          ? '敵方全軍覆沒！恭喜大獲全勝！'
          : '敵方無子可動（困斃），我軍凱旋！';
        sfx.playWin();
      } else {
        state.winReason = (redRemain === 0 || blkRemain === 0)
          ? '我方全軍覆沒，再接再厲！'
          : '我方無子可動（困斃），敵軍獲勝！';
        sfx.playLose();
      }
      state.screen = 'GAMEOVER';
      return;
    }

    if (state.mode === 'AI' && state.turn === state.aiSide && state.screen === 'PLAYING') {
      state.aiThinking = true;
      state.aiTimer = 0.42;
    }
  }

  function handleUndo() {
    if (state.flipAnim || state.moveAnim || state.battleAnim || state.aiThinking) return;
    if (state.history.length === 0) return;

    const steps = (state.mode === 'AI' && state.history.length >= 2) ? 2 : 1;
    let snap = null;
    for (let i = 0; i < steps; i++) {
      if (state.history.length > 0) snap = state.history.pop();
    }
    if (snap) {
      state.board = snap.board;
      state.turn = snap.turn;
      state.firstMover = snap.firstMover;
      state.playerSide = snap.playerSide;
      state.aiSide = snap.aiSide;
      state.lastMove = snap.lastMove;
      state.score = snap.score;
      state.turnCount = snap.turnCount;
      state.capturedByRed = snap.capturedByRed;
      state.capturedByBlack = snap.capturedByBlack;
      state.selected = null;
      state.legalMoves = [];
      sfx.playSelect();

      // 若悔棋回到電腦先手開局尚未翻開第一顆棋的狀態，讓電腦自動執行首翻
      if (state.mode === 'AI' && !state.playerSide && state.firstMover === 'OPPONENT') {
        state.aiThinking = true;
        state.aiTimer = 0.45;
      }
    }
  }

  // =========================================================================
  // 5. 3D 軟萌貓咪武將與暗棋盲盒木蓋繪製引擎
  // =========================================================================
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawButton(btn) {
    state.uiButtons.push(btn);
    ctx.save();
    roundRect(ctx, btn.x, btn.y, btn.w, btn.h, btn.r || 12);
    const grad = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
    grad.addColorStop(0, btn.bg1 || '#8b261d');
    grad.addColorStop(1, btn.bg2 || '#59130d');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = btn.border || '#e8b960';
    ctx.stroke();

    ctx.fillStyle = btn.color || '#fff3d6';
    ctx.font = `bold ${btn.fontSize || 20}px "PingFang TC", "Microsoft JhengHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
    ctx.restore();
  }

  function drawUnrevealedPiece(x, y, scaleX = 1, scaleY = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scaleX, scaleY);

    ctx.beginPath();
    ctx.ellipse(0, 7, 29, 22, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(45, 22, 8, 0.42)';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0, 4, 27, 20.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#3b2010';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#8c5328';
    ctx.stroke();

    const topGrad = ctx.createRadialGradient(-6, -6, 3, 0, -2, 27);
    topGrad.addColorStop(0, '#8c4f27');
    topGrad.addColorStop(0.65, '#593015');
    topGrad.addColorStop(1, '#381d0b');
    ctx.beginPath();
    ctx.ellipse(0, -2, 26, 19.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = topGrad;
    ctx.fill();

    ctx.lineWidth = 2.2;
    ctx.strokeStyle = '#eab657';
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(0, -2, 21, 15.2, 0, 0, Math.PI * 2);
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1.3;
    ctx.strokeStyle = 'rgba(255, 216, 102, 0.72)';
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ffd56b';
    ctx.beginPath();
    ctx.ellipse(0, 2, 7.2, 5.2, 0, 0, Math.PI * 2);
    ctx.fill();

    const toes = [
      { tx: -8.2, ty: -4.2, rot: -0.35 },
      { tx: -3.0, ty: -7.5, rot: -0.12 },
      { tx:  3.0, ty: -7.5, rot:  0.12 },
      { tx:  8.2, ty: -4.2, rot:  0.35 }
    ];
    for (const t of toes) {
      ctx.beginPath();
      ctx.ellipse(t.tx, t.ty, 2.7, 3.6, t.rot, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawRealisticCatHead(ctx, cx, cy, r, isRed, angry = false, charred = 0) {
    ctx.save();

    const furTopColor  = charred > 0.5 ? '#363432' : (isRed ? '#de8747' : '#525b66');
    const furDarkStripe = charred > 0.5 ? '#1c1b1a' : (isRed ? '#b35c20' : '#2a3038');
    const earInnerPink = charred > 0.5 ? '#474240' : (isRed ? '#eb9b8f' : '#9c848a');
    const earFluffWhite = charred > 0.5 ? '#555250' : '#fffcf7';

    [-1, 1].forEach(dir => {
      ctx.save();
      ctx.fillStyle = furTopColor;
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.42, cy - r * 0.62);
      ctx.quadraticCurveTo(cx + dir * r * 0.98, cy - r * 1.15, cx + dir * r * 1.12, cy - r * 0.92);
      ctx.quadraticCurveTo(cx + dir * r * 1.16, cy - r * 0.35, cx + dir * r * 0.88, cy - r * 0.08);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = furDarkStripe;
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = earInnerPink;
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.55, cy - r * 0.54);
      ctx.quadraticCurveTo(cx + dir * r * 0.92, cy - r * 0.94, cx + dir * r * 1.00, cy - r * 0.78);
      ctx.quadraticCurveTo(cx + dir * r * 0.98, cy - r * 0.36, cx + dir * r * 0.78, cy - r * 0.18);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = earFluffWhite;
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.52, cy - r * 0.32);
      ctx.lineTo(cx + dir * r * 0.82, cy - r * 0.52);
      ctx.lineTo(cx + dir * r * 0.74, cy - r * 0.34);
      ctx.lineTo(cx + dir * r * 0.88, cy - r * 0.36);
      ctx.lineTo(cx + dir * r * 0.68, cy - r * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    const rx = r * 1.22;
    const ry = r * 0.92;

    ctx.beginPath();
    ctx.ellipse(cx, cy + 1.8, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = charred > 0.5 ? '#121110' : 'rgba(95, 52, 24, 0.32)';
    ctx.fill();

    const faceGrad = ctx.createRadialGradient(
      cx, cy - ry * 0.15, r * 0.15,
      cx, cy + ry * 0.1, rx * 1.08
    );
    if (charred > 0.5) {
      faceGrad.addColorStop(0, '#524f4d');
      faceGrad.addColorStop(0.7, '#2b2927');
      faceGrad.addColorStop(1, '#171615');
    } else if (isRed) {
      faceGrad.addColorStop(0, '#ffffff');
      faceGrad.addColorStop(0.68, '#fff7eb');
      faceGrad.addColorStop(1, '#edd5bc');
    } else {
      faceGrad.addColorStop(0, '#f5f7fa');
      faceGrad.addColorStop(0.68, '#dce2e8');
      faceGrad.addColorStop(1, '#b0bac4');
    }

    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = furTopColor;
    [-1, 1].forEach(dir => {
      ctx.beginPath();
      ctx.moveTo(cx + dir * r * 0.08, cy - ry * 1.05);
      ctx.quadraticCurveTo(cx + dir * rx * 0.85, cy - ry * 0.95, cx + dir * rx * 1.05, cy - ry * 0.12);
      ctx.quadraticCurveTo(cx + dir * rx * 0.55, cy - ry * 0.25, cx + dir * r * 0.14, cy - ry * 0.42);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = furDarkStripe;
      ctx.beginPath();
      ctx.ellipse(cx + dir * r * 0.42, cy - ry * 0.65, r * 0.11, r * 0.32, dir * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + dir * r * 0.72, cy - ry * 0.48, r * 0.09, r * 0.26, dir * 0.55, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = furTopColor;
      ctx.beginPath();
      ctx.ellipse(cx + dir * rx * 0.76, cy + ry * 0.14, r * 0.22, r * 0.075, dir * -0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + dir * rx * 0.68, cy + ry * 0.34, r * 0.17, r * 0.068, dir * -0.12, 0, Math.PI * 2);
      ctx.fill();
    });

    if (charred <= 0.5) {
      ctx.fillStyle = isRed ? 'rgba(255, 138, 115, 0.36)' : 'rgba(235, 145, 165, 0.28)';
      ctx.beginPath();
      ctx.ellipse(cx - rx * 0.52, cy + ry * 0.12, r * 0.24, r * 0.14, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + rx * 0.52, cy + ry * 0.12, r * 0.24, r * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const eyeY = cy - ry * 0.06;
    const eyeX = rx * 0.40;
    ctx.strokeStyle = charred > 0.5 ? '#111111' : '#2b1911';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';

    [-1, 1].forEach(dir => {
      const ex = cx + dir * eyeX;
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.24, eyeY + dir * r * 0.03);
      ctx.quadraticCurveTo(ex, eyeY - r * 0.22, ex + r * 0.24, eyeY - dir * r * 0.01);
      ctx.stroke();

      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ex + dir * r * 0.18, eyeY - r * 0.04);
      ctx.lineTo(ex + dir * r * 0.29, eyeY - r * 0.10);
      ctx.stroke();
      ctx.lineWidth = 2.5;
    });

    const noseY = cy + ry * 0.02;
    ctx.fillStyle = charred > 0.5 ? '#262626' : '#f28b82';
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.11, noseY - r * 0.04);
    ctx.lineTo(cx + r * 0.11, noseY - r * 0.04);
    ctx.lineTo(cx, noseY + r * 0.06);
    ctx.closePath();
    ctx.fill();

    const mouthTopY = noseY + r * 0.07;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.30, mouthTopY + r * 0.04);
    ctx.quadraticCurveTo(cx - r * 0.12, mouthTopY - r * 0.03, cx, mouthTopY + r * 0.02);
    ctx.quadraticCurveTo(cx + r * 0.12, mouthTopY - r * 0.03, cx + r * 0.30, mouthTopY + r * 0.04);
    ctx.quadraticCurveTo(cx + r * 0.28, mouthTopY + r * 0.54, cx, mouthTopY + r * 0.56);
    ctx.quadraticCurveTo(cx - r * 0.28, mouthTopY + r * 0.54, cx - r * 0.30, mouthTopY + r * 0.04);
    ctx.closePath();

    ctx.fillStyle = charred > 0.5 ? '#1a1a1a' : '#7a2e28';
    ctx.fill();

    ctx.clip();
    ctx.fillStyle = charred > 0.5 ? '#404040' : '#f28b82';
    ctx.beginPath();
    ctx.ellipse(cx, mouthTopY + r * 0.42, r * 0.26, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = charred > 0.5 ? '#555' : '#ffb8b0';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = charred > 0.5 ? '#1a1a1a' : '#59221c';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.32, mouthTopY + r * 0.05);
    ctx.quadraticCurveTo(cx - r * 0.12, mouthTopY - r * 0.03, cx, mouthTopY + r * 0.02);
    ctx.quadraticCurveTo(cx + r * 0.12, mouthTopY - r * 0.03, cx + r * 0.32, mouthTopY + r * 0.05);
    ctx.stroke();

    ctx.strokeStyle = charred > 0.5 ? '#444' : (isRed ? '#b87648' : '#7c8794');
    ctx.lineWidth = 1.0;
    [-1, 1].forEach(dir => {
      ctx.beginPath();
      ctx.moveTo(cx + dir * rx * 0.48, cy + ry * 0.08);
      ctx.quadraticCurveTo(cx + dir * rx * 0.88, cy + ry * 0.02, cx + dir * rx * 1.18, cy + ry * 0.12);
      ctx.moveTo(cx + dir * rx * 0.50, cy + ry * 0.20);
      ctx.quadraticCurveTo(cx + dir * rx * 0.88, cy + ry * 0.20, cx + dir * rx * 1.15, cy + ry * 0.30);
      ctx.stroke();
    });

    ctx.restore();
  }

  function drawChibiCatBody(ctx, cx, cy, isRed, charred = 0, raiseArms = true) {
    ctx.save();
    ctx.translate(cx, cy);

    const scarfMain = charred > 0.5 ? '#33302e' : (isRed ? '#d9623b' : '#3b6e8c');
    const scarfDark = charred > 0.5 ? '#1c1a19' : (isRed ? '#a63f1e' : '#23465c');
    const coatCream = charred > 0.5 ? '#454240' : (isRed ? '#f7ead9' : '#d8e0e8');
    const coatBrok  = charred > 0.5 ? '#262423' : (isRed ? '#593e31' : '#2b333d');
    const pantsNavy = charred > 0.5 ? '#171615' : (isRed ? '#282c37' : '#181c24');
    const pawWhite  = charred > 0.5 ? '#4a4745' : '#fffbf5';
    const tailBase  = charred > 0.5 ? '#2e2b29' : (isRed ? '#c97236' : '#4a525d');

    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = tailBase;
    ctx.lineWidth = 6.8;
    ctx.beginPath();
    ctx.moveTo(-9, 13);
    ctx.quadraticCurveTo(-22, 12, -20, -2);
    ctx.stroke();

    ctx.strokeStyle = pawWhite;
    ctx.lineWidth = 6.8;
    ctx.beginPath();
    ctx.moveTo(-20.2, 5);
    ctx.lineTo(-20.5, 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-20, -3, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = pawWhite;
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = pawWhite;
    ctx.beginPath();
    ctx.ellipse(-7.5, 19, 5.2, 3.4, 0, 0, Math.PI * 2);
    ctx.ellipse(7.5, 19, 5.2, 3.4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = pantsNavy;
    roundRect(ctx, -12.5, 11, 12, 7.5, 3);
    ctx.fill();
    roundRect(ctx, 0.5, 11, 12, 7.5, 3);
    ctx.fill();
    ctx.fillStyle = '#7a6248';
    ctx.fillRect(-12, 16, 11, 2);
    ctx.fillRect(1, 16, 11, 2);

    ctx.fillStyle = pawWhite;
    roundRect(ctx, -8, 4, 16, 9, 4);
    ctx.fill();

    ctx.fillStyle = scarfMain;
    roundRect(ctx, -9, 9.5, 18, 3.2, 1.5);
    ctx.fill();
    ctx.fillRect(-1.2, 10, 2.4, 6.5);

    ctx.fillStyle = '#fffdf9';
    [-4, -2, 0, 2, 4].forEach((bx, idx) => {
      ctx.beginPath();
      ctx.arc(bx, 6.5 + (idx % 2 === 1 ? 1.2 : 0), 1.1, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = coatBrok;
    roundRect(ctx, -14, 2, 7, 12, 2.5);
    ctx.fill();
    roundRect(ctx, 7, 2, 7, 12, 2.5);
    ctx.fill();

    ctx.fillStyle = coatCream;
    ctx.beginPath();
    ctx.moveTo(-13.5, 3);
    ctx.lineTo(-5.5, 3);
    ctx.lineTo(-7.5, 13.5);
    ctx.lineTo(-14, 13.5);
    ctx.closePath();
    ctx.fill();

    if (raiseArms) {
      [-1, 1].forEach(dir => {
        ctx.save();
        ctx.translate(dir * 13.5, 4);
        ctx.rotate(dir * -0.45);
        ctx.fillStyle = coatBrok;
        roundRect(ctx, -4, -6, 8, 7, 2.5);
        ctx.fill();
        ctx.fillStyle = pawWhite;
        ctx.beginPath();
        ctx.arc(0, -7.5, 4.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    const scarfGrad = ctx.createLinearGradient(-12, 0, 12, 6);
    scarfGrad.addColorStop(0, scarfMain);
    scarfGrad.addColorStop(1, scarfDark);
    ctx.fillStyle = scarfGrad;
    roundRect(ctx, -12.5, 0, 25, 6.5, 3.2);
    ctx.fill();

    ctx.fillStyle = scarfMain;
    ctx.beginPath();
    ctx.moveTo(5, 3);
    ctx.lineTo(11.5, 3);
    ctx.lineTo(13, 14.5);
    ctx.lineTo(6.5, 14.5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f7d6c4';
    ctx.beginPath();
    ctx.arc(9.5, 10, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(6.8, 13.5, 6, 2);

    ctx.restore();
  }

  function draw3DCatModel(ctx, type, isRed, charred = 0) {
    const accentGold = charred > 0.5 ? '#55524f' : '#f5be4f';
    const woodDark   = charred > 0.5 ? '#262422' : '#78492a';
    const woodLight  = charred > 0.5 ? '#403d3a' : '#d49b6a';

    if (type === 'R') {
      drawChibiCatBody(ctx, 0, -2, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -9, 12.2, isRed, false, charred);

      const carGrad = ctx.createLinearGradient(0, 8, 0, 19);
      carGrad.addColorStop(0, isRed ? '#d9623b' : '#3b6e8c');
      carGrad.addColorStop(1, isRed ? '#8f3415' : '#1f3f54');
      roundRect(ctx, -20, 8, 40, 10, 5);
      ctx.fillStyle = carGrad;
      ctx.fill();

      roundRect(ctx, -16, 10, 32, 3, 1.5);
      ctx.fillStyle = woodLight;
      ctx.fill();

      [-11, 11].forEach(wx => {
        ctx.beginPath();
        ctx.arc(wx, 18, 5.2, 0, Math.PI * 2);
        ctx.fillStyle = '#2b2623';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(wx, 18, 2.4, 0, Math.PI * 2);
        ctx.fillStyle = accentGold;
        ctx.fill();
      });

    } else if (type === 'C') {
      ctx.save();
      ctx.translate(-14, 9);
      ctx.rotate(-0.55);
      roundRect(ctx, -4.5, -19, 9, 20, 3.5);
      ctx.fillStyle = charred > 0.5 ? '#2b2b2b' : '#4a5561';
      ctx.fill();
      roundRect(ctx, -5.5, -21, 11, 4, 2);
      ctx.fillStyle = accentGold;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(-14, 16.5, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = woodDark;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-14, 16.5, 2.3, 0, Math.PI * 2);
      ctx.fillStyle = accentGold;
      ctx.fill();

      drawChibiCatBody(ctx, 5, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 5, -7, 11.8, isRed, false, charred);

    } else if (type === 'H') {
      ctx.fillStyle = woodDark;
      roundRect(ctx, -13, 12, 4, 7.5, 2);
      ctx.fill();
      roundRect(ctx, 9, 12, 4, 7.5, 2);
      ctx.fill();

      roundRect(ctx, -15, 5, 29, 9.5, 4.8);
      ctx.fillStyle = woodLight;
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(14, 2, 5, 7.5, 0.3, 0, Math.PI * 2);
      ctx.fillStyle = woodLight;
      ctx.fill();

      drawChibiCatBody(ctx, -1, -3, isRed, charred, true);
      drawRealisticCatHead(ctx, -1, -10, 11.8, isRed, false, charred);

    } else if (type === 'E') {
      const eleColor = charred > 0.5 ? '#363636' : '#96a6b0';
      roundRect(ctx, -15, 5, 30, 12, 6);
      ctx.fillStyle = eleColor;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(13, 7, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = eleColor;
      ctx.lineWidth = 3.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(17, 8);
      ctx.quadraticCurveTo(22, 12, 18, 16);
      ctx.stroke();

      drawChibiCatBody(ctx, -1, -3, isRed, charred, true);
      drawRealisticCatHead(ctx, -1, -10, 11.8, isRed, false, charred);

    } else if (type === 'A') {
      ctx.strokeStyle = woodLight;
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-17, -15); ctx.lineTo(17, 15);
      ctx.moveTo(17, -15); ctx.lineTo(-17, 15);
      ctx.stroke();

      drawChibiCatBody(ctx, 0, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -7, 12.4, isRed, false, charred);

    } else if (type === 'K') {
      drawChibiCatBody(ctx, 0, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -7, 12.8, isRed, false, charred);

      ctx.fillStyle = accentGold;
      ctx.beginPath();
      ctx.moveTo(-7, -18);
      ctx.lineTo(-8, -25);
      ctx.lineTo(-3, -21);
      ctx.lineTo(0, -27);
      ctx.lineTo(3, -21);
      ctx.lineTo(8, -25);
      ctx.lineTo(7, -18);
      ctx.closePath();
      ctx.fill();

    } else {
      drawChibiCatBody(ctx, 0, 0, isRed, charred, true);
      drawRealisticCatHead(ctx, 0, -7, 12.4, isRed, false, charred);

      if (charred <= 0.5) {
        ctx.fillStyle = isRed ? '#e07a3c' : '#5c92b8';
        ctx.beginPath();
        ctx.arc(-18, -3, 2.2, 0, Math.PI * 2);
        ctx.arc(-15.5, -4.2, 2.2, 0, Math.PI * 2);
        ctx.lineTo(-17.8, 0.5);
        ctx.closePath();
        ctx.fill();

        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('♪', 16, -2);
      }

      ctx.strokeStyle = woodDark;
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(14, 17);
      ctx.lineTo(14, -14);
      ctx.stroke();
      if (charred <= 0.5) {
        ctx.fillStyle = '#d94832';
        ctx.beginPath();
        ctx.arc(14, -13, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPiece(x, y, piece, scale = 1, alpha = 1, rotation = 0, isSelected = false, charred = 0) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.scale(scale, scale);

    const isRed = piece.side === SIDE_RED;

    if (isSelected) {
      const pulse = 1 + Math.sin(state.animClock * 7) * 0.06;
      ctx.save();
      ctx.scale(pulse, pulse);
      ctx.beginPath();
      ctx.ellipse(0, 18, 25, 11, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 245, 215, 0.78)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = isRed ? '#e06b3c' : '#3b7ea1';
      ctx.stroke();
      ctx.restore();
    }

    if (charred < 0.7) {
      ctx.beginPath();
      ctx.ellipse(0, 19.5, 17, 6.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(80, 50, 25, 0.30)';
      ctx.fill();
    }

    const bounceY = isSelected ? (-4.5 + Math.sin(state.animClock * 8) * 2.2) : 0;
    ctx.translate(0, bounceY);

    draw3DCatModel(ctx, piece.type, isRed, charred);

    if (charred < 0.6) {
      const tagX = 17.5;
      const tagY = 14.5;
      ctx.save();
      ctx.beginPath();
      ctx.arc(tagX, tagY + 1.2, 9.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(50, 30, 15, 0.28)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(tagX, tagY, 9.5, 0, Math.PI * 2);
      ctx.fillStyle = isRed ? '#c94a29' : '#283c4f';
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = '#fff8eb';
      ctx.stroke();

      const label = PIECE_LABELS[piece.side][piece.type];
      ctx.fillStyle = '#fff8eb';
      ctx.font = 'bold 12px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, tagX, tagY + 0.5);
      ctx.restore();
    }

    ctx.restore();
  }

  // 繪製開局「喵拳爭先（猜拳決定先後手）」舞台畫面
  function renderRpsScreen() {
    roundRect(ctx, 26, 42, LOGICAL_W - 52, LOGICAL_H - 84, 22);
    const grad = ctx.createLinearGradient(0, 42, 0, LOGICAL_H - 42);
    grad.addColorStop(0, '#361f12');
    grad.addColorStop(0.5, '#26140b');
    grad.addColorStop(1, '#1a0d06');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#d4a253';
    ctx.stroke();

    // 標題與副標題
    ctx.fillStyle = '#ffd866';
    ctx.font = 'bold 36px "KaiTi", "DFKai-SB", "Microsoft JhengHei", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐾 喵拳爭先 · 決定先後手', LOGICAL_W / 2, 96);

    ctx.fillStyle = '#e8c996';
    ctx.font = 'bold 17px "PingFang TC", "Microsoft JhengHei", sans-serif';
    const subText = state.rps.round > 1
      ? `第 ${state.rps.round} 回合加賽！贏家奪得暗棋「先手首翻權」！`
      : '猜拳獲勝者可先手翻開第一顆暗棋，並決定雙方陣營花色！';
    ctx.fillText(subText, LOGICAL_W / 2, 138);

    // 對決舞台框
    const stageX = 48, stageY = 172, stageW = LOGICAL_W - 96, stageH = 340;
    roundRect(ctx, stageX, stageY, stageW, stageH, 18);
    const stGrad = ctx.createLinearGradient(0, stageY, 0, stageY + stageH);
    stGrad.addColorStop(0, '#233d3b');
    stGrad.addColorStop(1, '#152625');
    ctx.fillStyle = stGrad;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#82a39e';
    ctx.stroke();

    // 左右雙方貓咪主帥登場與搖擺動畫
    const isAnim = state.rps.phase === 'ANIM';
    const swingY = isAnim ? Math.sin(state.animClock * 28) * 16 : Math.sin(state.animClock * 4) * 3;

    // 左側：玩家 (1P)
    ctx.fillStyle = '#ff9e80';
    ctx.font = 'bold 18px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(state.mode === 'PVP' ? '【1P 玩家】' : '【您（玩家）】', 150, stageY + 36);
    drawPiece(150, stageY + 135 + swingY, { side: SIDE_RED, type: 'K', revealed: true }, 1.85);

    // 右側：電腦或 2P
    ctx.fillStyle = '#90d5ff';
    ctx.font = 'bold 18px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(state.mode === 'PVP' ? '【2P 對手】' : '【電腦貓宗師】', LOGICAL_W - 150, stageY + 36);
    drawPiece(LOGICAL_W - 150, stageY + 135 + swingY, { side: SIDE_BLACK, type: 'K', revealed: true }, 1.85);

    // 中央 VS 標誌
    ctx.fillStyle = '#ffd866';
    ctx.font = 'italic bold 28px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText('VS', LOGICAL_W / 2, stageY + 130);

    // 繪製雙方出拳圓章泡泡
    const drawHandBubble = (bx, by, choiceKey, isPending, borderColor) => {
      ctx.save();
      ctx.translate(bx, by + (isAnim ? Math.sin(state.animClock * 28) * 14 : 0));
      ctx.beginPath();
      ctx.arc(0, 0, 44, 0, Math.PI * 2);
      ctx.fillStyle = '#fff8eb';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = borderColor;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (isPending) {
        ctx.font = 'bold 34px "PingFang TC", sans-serif';
        ctx.fillStyle = '#78492a';
        ctx.fillText(isAnim ? '✊' : '❔', 0, -4);
        ctx.font = 'bold 13px "PingFang TC", sans-serif';
        ctx.fillText(isAnim ? '出拳中' : '請選擇', 0, 26);
      } else {
        const info = RPS_INFO[choiceKey];
        ctx.font = '36px sans-serif';
        ctx.fillText(info.icon, 0, -6);
        ctx.fillStyle = '#3b2010';
        ctx.font = 'bold 14px "PingFang TC", sans-serif';
        ctx.fillText(info.name, 0, 25);
      }
      ctx.restore();
    };

    const showResult = state.rps.phase === 'RESULT';
    drawHandBubble(150, stageY + 258, state.rps.playerChoice, !showResult, '#e06b3c');
    drawHandBubble(LOGICAL_W - 150, stageY + 258, state.rps.aiChoice, !showResult, '#3b7ea1');

    // 下方狀態與操作區
    if (state.rps.phase === 'CHOOSE') {
      ctx.fillStyle = '#ffe066';
      ctx.font = 'bold 22px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText('👇 請選擇您的出拳：', LOGICAL_W / 2, 558);

      const btnW = 132, btnH = 115, gap = 20;
      const startX = (LOGICAL_W - (btnW * 3 + gap * 2)) / 2;
      const btnY = 592;

      const choices = [
        { key: 'SCISSORS', label: '✌️ 剪刀', bg1: '#a33a1d', bg2: '#63200d' },
        { key: 'ROCK',     label: '✊ 石頭', bg1: '#8f5b19', bg2: '#54330a' },
        { key: 'PAPER',    label: '🖐️ 布',   bg1: '#2b664c', bg2: '#173b2b' }
      ];

      choices.forEach((ch, idx) => {
        drawButton({
          x: startX + idx * (btnW + gap),
          y: btnY,
          w: btnW,
          h: btnH,
          r: 18,
          label: ch.label,
          fontSize: 23,
          bg1: ch.bg1,
          bg2: ch.bg2,
          action: `RPS_${ch.key}`
        });
      });

    } else if (state.rps.phase === 'ANIM') {
      ctx.fillStyle = '#ffd866';
      ctx.font = 'bold 28px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText('剪刀、石頭、布 🐾！', LOGICAL_W / 2, 625);

    } else if (state.rps.phase === 'RESULT') {
      let resTitle = '';
      let resSub = '';
      let resColor = '#ffd866';

      if (state.rps.result === 'WIN') {
        resTitle = state.mode === 'PVP' ? '🎉 1P 猜拳獲勝！奪得先手！' : '🎉 恭喜猜拳獲勝！您獲得先手！';
        resSub = '即將進入棋盤，由您率先翻開第一顆暗棋決定花色...';
        resColor = '#ffe066';
      } else if (state.rps.result === 'LOSE') {
        resTitle = state.mode === 'PVP' ? '⚡ 2P 猜拳獲勝！由 2P 先手！' : '🤖 電腦猜拳獲勝！由電腦先手！';
        resSub = state.mode === 'PVP'
          ? '即將進入棋盤，由 2P 率先翻開第一顆暗棋...'
          : '即將進入棋盤，由電腦先翻開第一顆暗棋決定花色...';
        resColor = '#80caff';
      } else {
        resTitle = '🤝 雙方平手！不分高下！';
        resSub = '準備再次出拳一決勝負...';
        resColor = '#ffb870';
      }

      roundRect(ctx, 52, 555, LOGICAL_W - 104, 125, 16);
      ctx.fillStyle = 'rgba(20, 10, 5, 0.75)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = resColor;
      ctx.stroke();

      ctx.fillStyle = resColor;
      ctx.font = 'bold 25px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText(resTitle, LOGICAL_W / 2, 598);

      ctx.fillStyle = '#f5e6c8';
      ctx.font = '17px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText(resSub, LOGICAL_W / 2, 642);
    }

    drawButton({
      x: 155, y: 818, w: LOGICAL_W - 310, h: 50, r: 14,
      label: '🏠 返回主選單',
      fontSize: 18,
      bg1: '#4d3624',
      bg2: '#302014',
      action: 'MENU'
    });
  }

  function renderBattleCutscene(b) {
    const t = b.progress;
    const isRedAtk = b.attacker.side === SIDE_RED;

    let openAlpha = 1.0;
    if (t < 0.12) openAlpha = t / 0.12;
    else if (t > 0.88) openAlpha = Math.max(0, (1 - t) / 0.12);

    ctx.save();

    ctx.fillStyle = `rgba(10, 5, 2, ${0.78 * openAlpha})`;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    const stageX = 24, stageY = 230, stageW = LOGICAL_W - 48, stageH = 430;
    ctx.save();
    ctx.globalAlpha = openAlpha;

    roundRect(ctx, stageX, stageY, stageW, stageH, 20);
    const stageGrad = ctx.createLinearGradient(0, stageY, 0, stageY + stageH);
    stageGrad.addColorStop(0, '#2c1910');
    stageGrad.addColorStop(0.58, '#4a2b18');
    stageGrad.addColorStop(0.60, '#8c5830');
    stageGrad.addColorStop(1, '#523218');
    ctx.fillStyle = stageGrad;
    ctx.fill();

    ctx.save();
    roundRect(ctx, stageX + 4, stageY + 4, stageW - 8, stageH - 8, 16);
    ctx.clip();

    ctx.strokeStyle = isRedAtk ? 'rgba(255, 110, 60, 0.16)' : 'rgba(70, 175, 255, 0.16)';
    ctx.lineWidth = 4;
    for (let i = 0; i < 14; i++) {
      const ly = stageY + 20 + i * 22;
      const offset = ((t * 900 + i * 73) % 260) - 130;
      ctx.beginPath();
      ctx.moveTo(stageX + offset, ly);
      ctx.lineTo(stageX + stageW + offset, ly - 18);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(20, 10, 5, 0.55)';
    ctx.beginPath();
    ctx.moveTo(stageX, stageY + 265);
    ctx.lineTo(stageX + 110, stageY + 195);
    ctx.lineTo(stageX + 230, stageY + 245);
    ctx.lineTo(stageX + 370, stageY + 180);
    ctx.lineTo(stageX + stageW, stageY + 265);
    ctx.closePath();
    ctx.fill();

    const floorTop = stageY + 265;
    const floorGrad = ctx.createLinearGradient(0, floorTop, 0, stageY + stageH);
    floorGrad.addColorStop(0, '#a67442');
    floorGrad.addColorStop(1, '#5e3c1b');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(stageX, floorTop, stageW, stageH - 265);

    ctx.strokeStyle = 'rgba(55, 30, 12, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(stageX, floorTop);
    ctx.lineTo(stageX + stageW, floorTop);
    for (let i = -3; i <= 3; i++) {
      ctx.moveTo(LOGICAL_W / 2 + i * 55, floorTop);
      ctx.lineTo(LOGICAL_W / 2 + i * 115, stageY + stageH);
    }
    ctx.stroke();

    ctx.fillStyle = 'rgba(22, 11, 5, 0.88)';
    ctx.fillRect(stageX, stageY, stageW, 54);
    ctx.strokeStyle = '#d4a253';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(stageX, stageY + 54);
    ctx.lineTo(stageX + stageW, stageY + 54);
    ctx.stroke();

    const atkTitle = `【${PIECE_LABELS[b.attacker.side][b.attacker.type]}】${PIECE_TITLES[b.attacker.type]}`;
    const defTitle = `【${PIECE_LABELS[b.defender.side][b.defender.type]}】${PIECE_TITLES[b.defender.type]}`;
    ctx.font = 'bold 16px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = b.attacker.side === SIDE_RED ? '#ff9478' : '#80caff';
    ctx.fillText(atkTitle, stageX + 18, stageY + 27);

    ctx.textAlign = 'right';
    ctx.fillStyle = b.defender.side === SIDE_RED ? '#ff9478' : '#80caff';
    ctx.fillText(defTitle, stageX + stageW - 18, stageY + 27);

    ctx.textAlign = 'center';
    ctx.font = 'italic bold 22px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = '#ffd866';
    ctx.fillText('VS', LOGICAL_W / 2, stageY + 28);

    const baseAtkX = 148, baseAtkY = 472;
    const baseDefX = 392, baseDefY = 472;
    const modelScale = 2.35;

    let atkX = baseAtkX, atkY = baseAtkY, atkRot = 0, atkScale = modelScale;
    const type = b.attacker.type;

    if (t < 0.24) {
      const p = t / 0.24;
      atkX = baseAtkX - (1 - p) * 70 + Math.sin(p * 30) * 3;
      atkScale = modelScale * (0.9 + p * 0.15);
    } else if (t < 0.44) {
      const p = (t - 0.24) / 0.20;
      if (type === 'C') {
        atkX = baseAtkX - Math.sin(p * Math.PI) * 18;
        atkRot = -Math.sin(p * Math.PI) * 0.12;
      } else if (type === 'K') {
        atkY = baseAtkY - Math.sin(p * Math.PI) * 26;
        atkScale = modelScale * (1.05 + p * 0.2);
      } else if (type === 'E') {
        atkX = baseAtkX + Math.sin(p * Math.PI) * 14;
        atkY = baseAtkY - Math.sin(p * Math.PI * 2) * 12;
        atkRot = -Math.sin(p * Math.PI) * 0.22;
        atkScale = modelScale * (1.08 + Math.sin(p * Math.PI) * 0.22);
      } else if (type === 'H') {
        atkX = baseAtkX + (baseDefX - baseAtkX - 58) * Math.min(1, p * 1.25);
        atkY = baseAtkY - (p > 0.55 ? Math.sin(((p - 0.55) / 0.45) * Math.PI) * 65 : 0);
        atkRot = p > 0.5 ? -((p - 0.5) / 0.5) * Math.PI * 2 : 0.12;
      } else if (type === 'R') {
        atkX = baseAtkX + (baseDefX - baseAtkX - 25) * (p * p);
      } else {
        atkX = baseAtkX + (baseDefX - baseAtkX - 35) * p;
        atkY = baseAtkY - Math.sin(p * Math.PI) * 25;
      }
    } else {
      if (type === 'C' || type === 'K' || type === 'E') {
        atkX = baseAtkX;
        atkY = baseAtkY;
      } else {
        atkX = baseDefX - 65;
        atkY = baseDefY;
      }
    }

    if (t < 0.44) {
      const panicShake = t > 0.24 ? Math.sin(t * 95) * 5 : 0;
      drawPiece(baseDefX + panicShake, baseDefY, b.defender, modelScale, 1.0, 0, false, 0);
    } else {
      const dp = Math.min(1, (t - 0.44) / 0.48);
      if (b.deathStyle === 'ASH') {
        const shake = (1 - dp) * Math.sin(t * 90) * 7;
        const fadeAlpha = dp < 0.35 ? 1.0 : Math.max(0, 1 - (dp - 0.35) / 0.65);
        drawPiece(baseDefX + shake, baseDefY, b.defender, modelScale * (1 - dp * 0.12), fadeAlpha, 0, false, 1.0);

      } else if (b.deathStyle === 'ROYAL_BLAST') {
        const fadeAlpha = Math.max(0, 1 - dp * 1.15);
        drawPiece(baseDefX + dp * 24, baseDefY - dp * 28, b.defender, modelScale * (1 + dp * 0.45), fadeAlpha, dp * 0.2, false, 0);
        ctx.save();
        ctx.globalAlpha = Math.max(0, (1 - dp) * 0.85);
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        ctx.arc(baseDefX + dp * 24, baseDefY - dp * 28, 45 + dp * 55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

      } else if (b.deathStyle === 'SLASH_SPLIT') {
        const fadeAlpha = Math.max(0, 1 - Math.max(0, dp - 0.25) / 0.75);
        const slide = dp * 52;
        ctx.save();
        ctx.beginPath();
        ctx.rect(baseDefX - 110, baseDefY - 110, 220, 102);
        ctx.clip();
        drawPiece(baseDefX - slide, baseDefY - slide * 0.4, b.defender, modelScale, fadeAlpha, -dp * 0.28, false, 0);
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.rect(baseDefX - 110, baseDefY - 8, 220, 110);
        ctx.clip();
        drawPiece(baseDefX + slide, baseDefY + slide * 0.4, b.defender, modelScale, fadeAlpha, dp * 0.32, false, 0);
        ctx.restore();

      } else if (b.deathStyle === 'FLATTEN') {
        const fadeAlpha = Math.max(0, 1 - Math.max(0, dp - 0.4) / 0.6);
        ctx.save();
        ctx.translate(baseDefX + dp * 22, baseDefY + 38);
        ctx.scale(1.55, Math.max(0.14, 1 - dp * 2.8));
        drawPiece(0, -18, b.defender, modelScale, fadeAlpha, 0, false, 0);
        ctx.restore();

      } else if (b.deathStyle === 'SKY_LAUNCH') {
        if (dp < 0.78) {
          const sc = Math.max(0.15, modelScale * (1 - dp * 1.1));
          const skyX = baseDefX + dp * 35;
          const skyY = baseDefY - dp * 235;
          drawPiece(skyX, skyY, b.defender, sc, 1.0, dp * 16, false, 0);
        } else {
          const starP = (dp - 0.78) / 0.22;
          const starSize = Math.sin(starP * Math.PI) * 42;
          const sx = baseDefX + 28, sy = stageY + 95;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.fillStyle = '#fff9c4';
          ctx.beginPath();
          ctx.moveTo(0, -starSize);
          ctx.lineTo(starSize * 0.22, -starSize * 0.22);
          ctx.lineTo(starSize, 0);
          ctx.lineTo(starSize * 0.22, starSize * 0.22);
          ctx.lineTo(0, starSize);
          ctx.lineTo(-starSize * 0.22, starSize * 0.22);
          ctx.lineTo(-starSize, 0);
          ctx.lineTo(-starSize * 0.22, -starSize * 0.22);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

      } else if (b.deathStyle === 'SKEWER_FLY') {
        const flyX = baseDefX + dp * 140;
        const flyY = baseDefY - Math.sin(dp * Math.PI * 0.85) * 160 - dp * 40;
        const fadeAlpha = Math.max(0, 1 - dp * 1.1);
        drawPiece(flyX, flyY, b.defender, modelScale * (1 - dp * 0.3), fadeAlpha, dp * 18, false, 0);
      }
    }

    if (type === 'H' && t >= 0.20 && t <= 0.58) {
      for (let g = 1; g <= 3; g++) {
        const ghostX = Math.max(baseAtkX, atkX - g * 38);
        const ghostAlpha = Math.max(0, 0.42 - g * 0.11);
        drawPiece(ghostX, baseAtkY, b.attacker, modelScale * 0.96, ghostAlpha, 0.08, false, 0);
      }
    }
    drawPiece(atkX, atkY, b.attacker, atkScale, 1.0, atkRot, false, 0);

    if (type === 'C') {
      if (t >= 0.24 && t < 0.44) {
        const p = (t - 0.24) / 0.20;
        const bx = (atkX + 25) + (baseDefX - atkX - 25) * p;
        const by = (atkY - 25) + (baseDefY - atkY + 15) * p - Math.sin(p * Math.PI) * 95;
        if (p < 0.35) {
          ctx.fillStyle = 'rgba(255, 180, 40, 0.85)';
          ctx.beginPath();
          ctx.arc(atkX + 20, atkY - 28, 28 * (1 - p), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ff5500';
        ctx.beginPath();
        ctx.arc(bx, by, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff7c2';
        ctx.beginPath();
        ctx.arc(bx, by, 8, 0, Math.PI * 2);
        ctx.fill();
      } else if (t >= 0.44) {
        const ep = Math.min(1, (t - 0.44) / 0.45);
        ctx.strokeStyle = `rgba(255, 90, 20, ${1 - ep})`;
        ctx.lineWidth = 14 * (1 - ep);
        ctx.beginPath();
        ctx.arc(baseDefX, baseDefY, 30 + ep * 110, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (type === 'K') {
      if (t >= 0.24 && t < 0.44) {
        const p = (t - 0.24) / 0.20;
        const bx = (atkX + 35) + (baseDefX - atkX - 35) * p;
        const by = atkY - 10;
        const grad = ctx.createRadialGradient(bx, by, 5, bx, by, 42);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.45, '#ffd43b');
        grad.addColorStop(1, 'rgba(255, 120, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, 42, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type === 'A' && t >= 0.42 && t < 0.78) {
      const ep = (t - 0.42) / 0.36;
      ctx.save();
      ctx.translate(baseDefX, baseDefY);
      ctx.globalAlpha = 1 - ep;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12 * (1 - ep * 0.5);
      ctx.beginPath();
      ctx.moveTo(-95, -85); ctx.lineTo(95, 85);
      ctx.moveTo(95, -85); ctx.lineTo(-95, 85);
      ctx.stroke();
      ctx.restore();
    } else if (type === 'E') {
      if (t >= 0.24 && t < 0.52) {
        const wp = (t - 0.24) / 0.28;
        const startX = atkX + 36, startY = atkY - 12;
        const endX = startX + (baseDefX - startX) * Math.min(1, wp * 1.4);
        const endY = startY + (baseDefY - startY) * Math.min(1, wp * 1.4);
        ctx.save();
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
        ctx.lineWidth = 22 * (1 - wp * 0.3);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo((startX + endX) / 2, startY - 28, endX, endY);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 9 * (1 - wp * 0.3);
        ctx.stroke();
        ctx.restore();
      }
      if (t >= 0.32) {
        const fallP = Math.min(1, (t - 0.32) / 0.12);
        const fadeP = t > 0.72 ? Math.max(0, 1 - (t - 0.72) / 0.22) : 1.0;
        const rockY = (stageY + 40) + (baseDefY + 12 - (stageY + 40)) * (fallP * fallP);
        ctx.save();
        ctx.globalAlpha = fadeP;
        ctx.translate(baseDefX, rockY);
        const rockGrad = ctx.createLinearGradient(-45, -45, 45, 35);
        rockGrad.addColorStop(0, '#9ca3af');
        rockGrad.addColorStop(0.5, '#6b7280');
        rockGrad.addColorStop(1, '#374151');
        ctx.fillStyle = rockGrad;
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-38, -32);
        ctx.lineTo(-12, -46);
        ctx.lineTo(24, -42);
        ctx.lineTo(46, -18);
        ctx.lineTo(42, 22);
        ctx.lineTo(-42, 22);
        ctx.lineTo(-48, -8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 26px "KaiTi", "DFKai-SB", serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('泰山', 0, -8);
        ctx.restore();
      }
      if (t >= 0.44) {
        const ep = Math.min(1, (t - 0.44) / 0.48);
        ctx.save();
        ctx.translate(baseDefX, baseDefY + 36);
        for (let k = 0; k < 3; k++) {
          const rx = Math.max(4, (35 + ep * 120) - k * 20);
          const ry = Math.max(3, (14 + ep * 42) - k * 8);
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255, 210, 95, ${Math.max(0, 1 - ep)})`;
          ctx.lineWidth = Math.max(1, 6 - k);
          ctx.stroke();
        }
        ctx.restore();
      }
    } else if (type === 'H' && t >= 0.40) {
      const ep = Math.min(1, (t - 0.40) / 0.48);
      ctx.save();
      if (ep < 0.55) {
        const slashP = ep / 0.55;
        ctx.save();
        ctx.translate(baseDefX - 10, baseDefY - 10);
        ctx.rotate(-0.65);
        ctx.strokeStyle = `rgba(255, 230, 102, ${1 - slashP})`;
        ctx.lineWidth = 14 * (1 - slashP);
        ctx.beginPath();
        ctx.arc(0, 0, 42 + slashP * 45, -Math.PI * 0.45, Math.PI * 0.45);
        ctx.stroke();
        ctx.restore();
      }
      const dp = Math.min(1, Math.max(0, (t - 0.44) / 0.48));
      if (dp > 0 && dp < 0.80) {
        const skyX = baseDefX + dp * 35;
        const skyY = baseDefY - dp * 235;
        const tailGrad = ctx.createLinearGradient(baseDefX, baseDefY, skyX, skyY);
        tailGrad.addColorStop(0, 'rgba(255, 215, 60, 0)');
        tailGrad.addColorStop(1, 'rgba(255, 240, 150, 0.85)');
        ctx.strokeStyle = tailGrad;
        ctx.lineWidth = 16 * (1 - dp * 0.6);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(baseDefX, baseDefY);
        ctx.lineTo(skyX, skyY);
        ctx.stroke();
      }
      ctx.restore();
    } else if (type === 'P' && t >= 0.38 && t < 0.72) {
      const ep = (t - 0.38) / 0.34;
      ctx.save();
      ctx.translate(baseDefX, baseDefY);
      ctx.globalAlpha = 1 - ep;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.moveTo(-80, -14);
      ctx.lineTo(95 + ep * 40, -25);
      ctx.lineTo(-80, 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (t >= 0.43 && t <= 0.50) {
      const flashAlpha = Math.sin(((t - 0.43) / 0.07) * Math.PI) * 0.55;
      ctx.fillStyle = `rgba(255, 245, 200, ${flashAlpha})`;
      ctx.fillRect(stageX, stageY, stageW, stageH);
    }

    ctx.restore();

    roundRect(ctx, stageX, stageY, stageW, stageH, 20);
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = '#e8b960';
    ctx.stroke();

    const bannerW = 320, bannerH = 46;
    const bannerX = (LOGICAL_W - bannerW) / 2;
    const bannerY = stageY + stageH - 28;
    roundRect(ctx, bannerX, bannerY, bannerW, bannerH, 23);
    ctx.fillStyle = '#1a0c05';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffd866';
    ctx.stroke();

    ctx.fillStyle = '#ffd866';
    ctx.font = 'bold 24px "KaiTi", "DFKai-SB", "PingFang TC", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.title, LOGICAL_W / 2, bannerY + bannerH / 2 + 1);

    ctx.restore();

    if (b.deathStyle === 'SCREEN_FLY' && t >= 0.44) {
      const flyP = (t - 0.44) / 0.56;
      const flyAlpha = flyP > 0.76 ? Math.max(0, 1 - (flyP - 0.76) / 0.24) : 1.0;
      drawPiece(b.defFlyX, b.defFlyY, b.defender, b.defScale, flyAlpha, b.defRot, false, 0);
    }

    ctx.restore();
  }

  function drawDarkBoard() {
    const pad = 20;
    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad + 7, BOARD_W + pad * 2, BOARD_H + pad * 2, 18);
    ctx.fillStyle = '#9c7147';
    ctx.fill();

    roundRect(ctx, BOARD_LEFT - pad, BOARD_TOP - pad, BOARD_W + pad * 2, BOARD_H + pad * 2, 18);
    const boardGrad = ctx.createLinearGradient(0, BOARD_TOP - pad, 0, BOARD_TOP + BOARD_H + pad);
    boardGrad.addColorStop(0, '#edd1a7');
    boardGrad.addColorStop(0.5, '#e2be8d');
    boardGrad.addColorStop(1, '#d4ad79');
    ctx.fillStyle = boardGrad;
    ctx.fill();

    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#b58858';
    ctx.stroke();

    ctx.strokeStyle = '#754c24';
    ctx.lineWidth = 3;
    ctx.strokeRect(BOARD_LEFT - 5, BOARD_TOP - 5, BOARD_W + 10, BOARD_H + 10);

    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#7d542d';
    for (let r = 0; r <= ROWS; r++) {
      const y = BOARD_TOP + r * CELL_H;
      ctx.beginPath();
      ctx.moveTo(BOARD_LEFT, y);
      ctx.lineTo(BOARD_LEFT + BOARD_W, y);
      ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
      const x = BOARD_LEFT + c * CELL_W;
      ctx.beginPath();
      ctx.moveTo(x, BOARD_TOP);
      ctx.lineTo(x, BOARD_TOP + BOARD_H);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(125, 84, 45, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(BOARD_LEFT + CELL_W, BOARD_TOP + CELL_H * 3);
    ctx.lineTo(BOARD_LEFT + CELL_W * 3, BOARD_TOP + CELL_H * 5);
    ctx.moveTo(BOARD_LEFT + CELL_W * 3, BOARD_TOP + CELL_H * 3);
    ctx.lineTo(BOARD_LEFT + CELL_W, BOARD_TOP + CELL_H * 5);
    ctx.stroke();
    ctx.restore();

    if (state.lastMove) {
      const fPos = gridToPixel(state.lastMove.fr, state.lastMove.fc);
      const tPos = gridToPixel(state.lastMove.tr, state.lastMove.tc);
      ctx.strokeStyle = 'rgba(42, 130, 50, 0.85)';
      ctx.lineWidth = 2.5;
      if (state.lastMove.fr !== state.lastMove.tr || state.lastMove.fc !== state.lastMove.tc) {

      }
      roundRect(ctx, tPos.x - 42, tPos.y - 26, 84, 52, 10);
      ctx.stroke();
    }
